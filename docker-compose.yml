services:
  mongodb:
    image: mongo:7
    container_name: appliance-store-mongodb
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongodb_data:/data/db

  server:
    build:
      context: ./server
    container_name: appliance-store-server
    restart: unless-stopped
    ports:
      - '3000:3000'
    env_file:
      - ./server/.env
    environment:
      MONGODB_URI: mongodb://mongodb:27017/appliance-store
    depends_on:
      - mongodb

  client:
    build:
      context: ./client
    container_name: appliance-store-client
    restart: unless-stopped
    ports:
      - '5173:5173'
    env_file:
      - ./client/.env
    depends_on:
      - server

volumes:
  mongodb_data:
